<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: panorama.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#ebeaea}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2688px">
  <div class="r-nav-bar region chrome" data-region="nav-bar"><!-- white navigation bar band across the full width above the destination strip --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- wordmark KKN Travels in burgundy medium grotesque sans on the white navigation bar --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- five navigation links Visas Flights Attestation Typing Holidays in small charcoal sans --><p style="line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-lang region text" data-region="nav-lang"><!-- language switch link in Arabic script --><p style="line-height:1.05;margin:0">nav-lang</p></div>
  <div class="r-nav-whatsapp region control" data-region="nav-whatsapp"><!-- solid burgundy pill button with white text WhatsApp us: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-whatsapp); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-photo-dubai region plate" data-region="photo-dubai"><img src="../../../public/images/destinations/dubai.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-photo-istanbul region plate" data-region="photo-istanbul"><img src="../../../public/images/destinations/istanbul.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-photo-paris region plate" data-region="photo-paris"><img src="../../../public/images/destinations/paris.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-photo-maldives region plate" data-region="photo-maldives"><img src="../../../public/images/destinations/maldives.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-photo-makkah region plate" data-region="photo-makkah"><img src="../../../public/images/destinations/makkah.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-dubai region text" data-region="label-dubai"><!-- white place-name caption reading Dubai in small medium-weight sans type --><p style="line-height:1.05;margin:0">label-dubai</p></div>
  <div class="r-label-istanbul region text" data-region="label-istanbul"><!-- white place-name caption reading Istanbul in small medium-weight sans type --><p style="line-height:1.05;margin:0">label-istanbul</p></div>
  <div class="r-label-paris region text" data-region="label-paris"><!-- white place-name caption reading Paris in small medium-weight sans type --><p style="line-height:1.05;margin:0">label-paris</p></div>
  <div class="r-label-maldives region text" data-region="label-maldives"><!-- white place-name caption reading Maldives in small medium-weight sans type --><p style="line-height:1.05;margin:0">label-maldives</p></div>
  <div class="r-label-makkah region text" data-region="label-makkah"><!-- white place-name caption reading Makkah in small medium-weight sans type --><p style="line-height:1.05;margin:0">label-makkah</p></div>
  <div class="r-headline region text" data-region="headline"><!-- three-line headline Visas and flights, sorted at one desk in Dubai. in charcoal medium grotesque sans --><p style="line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- two-line paragraph in small charcoal sans describing the services --><p style="line-height:1.05;margin:0">lede</p></div>
  <div class="r-cta-start region control" data-region="cta-start"><!-- solid burgundy pill button with white text Start on WhatsApp: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-start); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cta-call region text" data-region="cta-call"><!-- text link Call +971 4 000 0000 with a thin underline --><p style="line-height:1.05;margin:0">cta-call</p></div>
  <div class="r-svc-visas region control" data-region="svc-visas"><!-- service index link: title Visas with one line of small grey text and a small burgundy chevron at the right: rebuild the control's chrome from the crop (comp-spec.mjs --crop svc-visas); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-svc-visas-abroad region control" data-region="svc-visas-abroad"><!-- service index link: title Visas abroad with one line of small grey text and a small burgundy chevron at the right: rebuild the control's chrome from the crop (comp-spec.mjs --crop svc-visas-abroad); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-svc-flights region control" data-region="svc-flights"><!-- service index link: title Flights with one line of small grey text and a small burgundy chevron at the right: rebuild the control's chrome from the crop (comp-spec.mjs --crop svc-flights); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-svc-attestation region control" data-region="svc-attestation"><!-- service index link: title Attestation with one line of small grey text and a small burgundy chevron at the right: rebuild the control's chrome from the crop (comp-spec.mjs --crop svc-attestation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-svc-typing region control" data-region="svc-typing"><!-- service index link: title Typing with one line of small grey text and a small burgundy chevron at the right: rebuild the control's chrome from the crop (comp-spec.mjs --crop svc-typing); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-svc-holidays region control" data-region="svc-holidays"><!-- service index link: title Holidays and Umrah with one line of small grey text and a small burgundy chevron at the right: rebuild the control's chrome from the crop (comp-spec.mjs --crop svc-holidays); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-a1 region chrome" data-region="rule-a1"><!-- thin grey hairline rule separating service index rows --></div>
  <div class="r-rule-a2 region chrome" data-region="rule-a2"><!-- thin grey hairline rule separating service index rows --></div>
  <div class="r-rule-b1 region chrome" data-region="rule-b1"><!-- thin grey hairline rule separating service index rows --></div>
  <div class="r-rule-b2 region chrome" data-region="rule-b2"><!-- thin grey hairline rule separating service index rows --></div>
</main>
</body>
</html>
